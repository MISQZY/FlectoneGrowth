pluginVersion=0.2.8

# MC 26.2 (the line spigotVersion below targets) requires a JVM 25+ runtime
# to even launch the server - bumped from 21 to match (originally surfaced
# via paper-api's own Gradle dependency-resolution metadata rejecting an
# older toolchain outright; paper-api is no longer a dependency here since
# the paper module was merged into this one, but the underlying JDK
# requirement is the server's, not the API jar's, so it still applies).
javaVersion=25
shadowVersion=9.6.1

guiceVersion=7.0.0
adventureVersion=5.2.0
snakeyamlVersion=2.4
lombokVersion=1.18.42

# spigot-api uses the "<mcVersion>-R0.1-SNAPSHOT" scheme, resolved via the
# same repo.papermc.io mirror as everything else here (see docs/BUILD.md).
spigotVersion=26.2-R0.1-SNAPSHOT
velocityVersion=4.0.0

placeholderapiVersion=2.12.3
# Real, published Maven Central release (verified: repo1.maven.org resolves
# core-1.12.2.jar directly, and maven-metadata.xml's <release> tag confirms
# 1.12.2 is current) - not FlectonePulse's Bukkit plugin jar itself, just its
# "core" module's classes, compileOnly'd so we can call its actual Java API
# instead of re-parsing its config.yml/message.yml off disk by hand. Not a
# -SNAPSHOT: FlectonePulse tags a real release version before every publish,
# so mavenCentral() (declared in the root build.gradle.kts) resolves this on
# its own - no snapshot repository needed.
flectonePulseVersion=1.12.2
# Not a real project dependency - core-1.12.0.jar's own classes reference
# org.apache.commons.lang3.* (Pair, Strings, StringUtils, ArrayUtils) in
# their method signatures without bundling or declaring it (FlectonePulse
# pulls it in at its own runtime via Libby, its runtime dependency
# downloader - see its published POM). javac still needs those classes
# resolvable to process @Nullable type annotations on methods this project
# never even calls (e.g. EventMetadata#sound()) the moment it references
# any FlectonePulse class whose signature touches them transitively -
# compileOnly, so it adds nothing to the shaded jar.
commonsLang3Version=3.20.0

# cloud-bukkit/cloud-velocity exited beta and are GA as of 2.0.0;
# cloud-core/cloud-annotations are ahead at 2.1.0.
cloudCoreVersion=2.1.0
cloudBukkitVersion=2.0.0

h2Version=2.3.232
mysqlVersion=9.3.0
mariadbVersion=3.5.3
hikariVersion=6.3.0
