# MiniMessage-formatted strings. See https://docs.advntr.dev/minimessage/format.html
# <primary>/<secondary> pull from config.yml's colors.primary/colors.secondary.
# <fcolor:N> pulls from FlectonePulse's own configured default colors
# (message.yml's format.fcolor.default_colors) when FlectonePulse is
# installed and enabled - a no-op otherwise.
# <red> is reserved for errors/failures - every other color comes from
# colors.primary/colors.secondary above.
#
# <primary>/<secondary>/<fcolor:N> apply forward from that point (like
# FlectonePulse's own <fcolor:N>) rather than being scoped to their </tag> -
# after a short inner span (e.g. a name), re-open the surrounding color
# explicitly to return to it, don't rely on the closing tag to restore it.

command:
  players-only: '<red>This command can only be used by a player.</red>'
  no-permission: '<red>You don''t have permission to use this command.</red>'
  error: '<red>Something went wrong running that command. Ask an admin to check the console.</red>'
  invalid-syntax: |-
    <secondary>|</secondary>
    <secondary>|</secondary> <secondary>Usage →</secondary>
    <secondary>|</secondary> <hover:show_text:'<secondary>Use <br><primary><usage>'><click:suggest_command:'<command>'><primary><usage></click></hover>
    <secondary>|</secondary>

height:
  unit: 'm'
  set: '<primary>Set <secondary><player></secondary><primary>''s height to <secondary><value></secondary><primary> m.'
  invalid: '<red>Height must be between <secondary><min></secondary><red> and <secondary><max></secondary><red> m.'
  removed: '<primary><secondary><player></secondary><primary>''s custom height was removed.'
  remove-failed: '<red>Failed to remove custom height.</red>'

gender:
  disabled: '<red>Genders are disabled on this server.</red>'
  unknown: '<red>Unknown gender "<secondary><input></secondary><red>".'
  set: '<primary><secondary><player></secondary><primary>''s gender set to <secondary><gender></secondary><primary>.'
  set-failed: '<red>Failed to set gender.</red>'
  display:
    male: 'Male'
    female: 'Female'

growth-info:
  header: |-
    <hover:show_text:'<secondary>Click to view your own growth summary'><click:run_command:'/growth summary'><primary>--- <secondary><player></secondary><primary>'s growth ---</click></hover>
  height: '<secondary>Height: <primary><value> <unit></primary><secondary> (<gender>)'
  gender: '<secondary>Gender: <primary><gender>'
  max-reached: '<primary>Fully grown.</primary>'
  remaining: '<secondary>Time remaining: <primary><time>'
  unknown-player: '<red>No player named "<secondary><player></secondary><red>" has ever been seen on this server.'

admin:
  reloaded: |-
    <hover:show_text:'<secondary>Click to reload again'><click:run_command:'/flectonegrowth reload'><primary><secondary>FlectoneGrowth</secondary><primary> configuration successfully reloaded! (<secondary><time></secondary><primary>).</click></hover>
  update-available: |-
    <primary>A new <secondary>FlectoneGrowth</secondary><primary> version is available: <secondary><latest></secondary><primary> (you have <secondary><current></secondary><primary>). <hover:show_text:'<secondary>Click to open the tags page'><click:open_url:'<url>'><secondary><u>Download</u></secondary></click></hover>
  migrate-playtime-started: '<primary>Migrating playtime for <secondary><count></secondary><primary> known player(s)... this may take a moment.'
  migrate-playtime-done: '<primary>Playtime migration complete: <secondary><migrated></secondary><primary> migrated, <secondary><skipped></secondary><primary> skipped.'
  migrate-playtime-sync-disabled: '<red>Note: network.sync-enabled is off, so migrated playtime has no effect on growth yet - growth reads the live statistic directly on a single, unsynced server. Enable network.sync-enabled first if you want it to take effect.</red>'

time:
  days: 'd'
  hours: 'h'
  mins: 'm'
  seconds: 's'
