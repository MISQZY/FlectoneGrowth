# MiniMessage-formatted strings. See https://docs.advntr.dev/minimessage/format.html
# <primary>/<secondary> pull from config.yml's colors.primary/colors.secondary.
# <fcolor:N> pulls from FlectonePulse's own configured default colors
# (message.yml's format.fcolor.default_colors) when FlectonePulse is
# installed and enabled - a no-op otherwise.
# <red> is reserved for errors/failures - every other color comes from
# colors.primary/colors.secondary above.
#
# <primary>/<secondary>/<fcolor:N> apply forward from that point (like
# FlectonePulse's own <fcolor:N>) rather than being scoped to their </tag> -
# after a short inner span (e.g. a name), re-open the surrounding color
# explicitly to return to it, don't rely on the closing tag to restore it.

command:
  players-only: '<red>This command can only be used by a player.</red>'
  invalid-syntax: |-
    <secondary>|</secondary>
    <secondary>|</secondary> <secondary>Usage →<secondary>
    <secondary>|</secondary> <primary><syntax></primary>
    <secondary>|</secondary>

height:
  unit: 'm'
  set: '<primary>Set <secondary><player></secondary><primary>''s height to <secondary><value></secondary><primary> m.'
  invalid: '<red>Height must be between <secondary><min></secondary><red> and <secondary><max></secondary><red> m.'
  removed: '<primary><secondary><player></secondary><primary>''s custom height was removed.'
  remove-failed: '<red>Failed to remove custom height.</red>'

gender:
  disabled: '<red>Genders are disabled on this server.</red>'
  unknown: '<red>Unknown gender "<secondary><input></secondary><red>".'
  set: '<primary><secondary><player></secondary><primary>''s gender set to <secondary><gender></secondary><primary>.'
  set-failed: '<red>Failed to set gender.</red>'
  display:
    male: 'Male'
    female: 'Female'

growth-info:
  header: '<primary>--- <secondary><player></secondary><primary>''s growth ---'
  height: '<secondary>Height: <primary><value> <unit></primary><secondary> (<gender>)'
  gender: '<secondary>Gender: <primary><gender>'
  max-reached: '<primary>Fully grown.</primary>'
  remaining: '<secondary>Time remaining: <primary><time>'

admin:
  reloaded: '<primary><secondary>FlectoneGrowth</secondary> configuration successfully reloaded! (<secondary><time></secondary>).</primary>'
  update-available: '<primary>A new <secondary>FlectoneGrowth</secondary> version is available: <secondary><latest></secondary><primary> (you have <secondary><current></secondary><primary>). Download: <secondary><url></secondary>'

help:
  header: '<primary>--- FlectoneGrowth commands ---</primary>'
  entry: '<secondary><syntax> - <primary><description>'
  height: 'Set your own height, in meters.'
  height-remove: 'Remove your custom height.'
  height-set-others: 'Set another player''s height, in meters.'
  height-remove-others: 'Remove another player''s custom height.'
  gender: 'Set your own gender.'
  gender-others: 'Set another player''s gender.'
  growth-summary: 'View your own growth summary.'
  growth-summary-others: 'View another player''s growth summary.'
  growth-height: 'View your own height info.'
  growth-height-others: 'View another player''s height info.'
  growth-gender: 'View your own gender info.'
  growth-gender-others: 'View another player''s gender info.'
  reload: 'Reload the FlectoneGrowth configuration.'
  help: 'Show this help message.'

time:
  days: 'd'
  hours: 'h'
  mins: 'm'
  seconds: 's'
