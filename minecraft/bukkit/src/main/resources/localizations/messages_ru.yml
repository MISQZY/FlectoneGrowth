# MiniMessage-formatted strings. See https://docs.advntr.dev/minimessage/format.html
# <primary>/<secondary> pull from config.yml's colors.primary/colors.secondary.
# <fcolor:N> pulls from FlectonePulse's own configured default colors
# (message.yml's format.fcolor.default_colors) when FlectonePulse is
# installed and enabled - a no-op otherwise.
# <red> is reserved for errors/failures - every other color comes from
# colors.primary/colors.secondary above.
#
# <primary>/<secondary>/<fcolor:N> apply forward from that point (like
# FlectonePulse's own <fcolor:N>) rather than being scoped to their </tag> -
# after a short inner span (e.g. a name), re-open the surrounding color
# explicitly to return to it, don't rely on the closing tag to restore it.

command:
  players-only: '<red>Эта команда доступна только игрокам.</red>'
  no-permission: '<red>У вас нет прав на использование этой команды.</red>'
  error: '<red>Не удалось выполнить команду. Попросите администратора проверить консоль.</red>'
  invalid-syntax: |-
    <secondary>|</secondary>
    <secondary>|</secondary> <secondary>Использование →</secondary>
    <secondary>|</secondary> <primary><syntax></primary>
    <secondary>|</secondary>

height:
  unit: 'м'
  set: '<primary>Рост <secondary><player></secondary><primary> установлен на <secondary><value></secondary><primary> м.'
  invalid: '<red>Рост должен быть между <secondary><min></secondary><red> и <secondary><max></secondary><red> м.'
  removed: '<primary>Индивидуальный рост игрока <secondary><player></secondary><primary> сброшен.'
  remove-failed: '<red>Не удалось сбросить рост.</red>'

gender:
  disabled: '<red>Пол отключён на этом сервере.</red>'
  unknown: '<red>Неизвестный пол "<secondary><input></secondary><red>".'
  set: '<primary>Пол игрока <secondary><player></secondary><primary> установлен: <secondary><gender></secondary><primary>.'
  set-failed: '<red>Не удалось установить пол.</red>'
  display:
    male: 'Мужской'
    female: 'Женский'

growth-info:
  header: '<primary>--- Рост игрока <secondary><player></secondary><primary> ---'
  height: '<secondary>Рост: <primary><value> <unit></primary><secondary> (<gender>)'
  gender: '<secondary>Пол: <primary><gender>'
  max-reached: '<primary>Рост завершён.</primary>'
  remaining: '<secondary>Осталось времени: <primary><time>'

admin:
  reloaded: '<primary>Конфигурация <secondary>FlectoneGrowth</secondary><primary> успешно перезагружена! (<secondary><time></secondary><primary>).'
  update-available: '<primary>Доступна новая версия <secondary>FlectoneGrowth</secondary><primary>: <secondary><latest></secondary><primary> (у вас <secondary><current></secondary><primary>). Скачать: <secondary><url></secondary>'
  migrate-playtime-started: '<primary>Миграция игрового времени для <secondary><count></secondary><primary> известных игроков... это может занять некоторое время.'
  migrate-playtime-done: '<primary>Миграция игрового времени завершена: <secondary><migrated></secondary><primary> перенесено, <secondary><skipped></secondary><primary> пропущено.'
  migrate-playtime-sync-disabled: '<red>Внимание: network.sync-enabled отключён, поэтому перенесённое время пока не влияет на рост - на одиночном несинхронизированном сервере рост считается напрямую по статистике игры. Включите network.sync-enabled, чтобы миграция вступила в силу.</red>'

time:
  days: 'д'
  hours: 'ч'
  mins: 'м'
  seconds: 'с'
