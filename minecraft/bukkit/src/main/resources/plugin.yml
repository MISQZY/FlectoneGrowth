name: FlectoneGrowth
version: '${pluginVersion}'
main: org.misqzy.flectonegrowth.bukkit.FlectoneGrowthPlugin
api-version: '1.20.5'
authors: [MISQZY]
description: Gradual player height/scale growth with per-gender caps and optional cross-server sync.
softdepend: [PlaceholderAPI, FlectonePulse]

permissions:
  flectonegrowth.height:
    description: Set your own height.
    default: true
  flectonegrowth.height.others:
    description: Set another player's height.
    default: op
  flectonegrowth.gender:
    description: Set your own gender.
    default: true
  flectonegrowth.gender.others:
    description: Set another player's gender.
    default: op
  flectonegrowth.info:
    description: View your own growth info.
    default: true
  flectonegrowth.info.others:
    description: View another player's growth info.
    default: op
  flectonegrowth.admin.reload:
    description: Reload the FlectoneGrowth configuration.
    default: op
  flectonegrowth.admin.migrate:
    description: Migrate playtime data into FlectoneGrowth's own tracking.
    default: op
  flectonegrowth.update-notify:
    description: Get notified in-game when a newer FlectoneGrowth version is available.
    default: op
